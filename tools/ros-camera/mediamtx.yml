# MediaMTX v1.21.2. Run only through run_mediamtx.sh, which creates local TLS files.
# The browser must authenticate to the HMI backend before receiving a short-lived
# camera grant. MediaMTX asks that backend to validate each WHEP read request.
logLevel: info
rtsp: false
rtmp: false
hls: false
srt: false
moq: false
api: false
metrics: false
webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcEncryption: true
webrtcServerKey: .local/server.key
webrtcServerCert: .local/server.crt
webrtcLocalUDPAddress: 127.0.0.1:8189
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: [127.0.0.1]
webrtcAllowOrigins: ["https://127.0.0.1:5173", "https://localhost:5173"]
authMethod: http
authHTTPAddress: http://127.0.0.1:3001/api/internal/camera-media-auth
paths:
  front:
    source: udp+rtp://127.0.0.1:5004
    rtpSDP: |
      v=0
      o=- 0 0 IN IP4 127.0.0.1
      s=Front camera
      c=IN IP4 127.0.0.1
      t=0 0
      m=video 5004 RTP/AVP 96
      a=rtpmap:96 VP8/90000
  rear:
    source: udp+rtp://127.0.0.1:5006
    rtpSDP: |
      v=0
      o=- 0 0 IN IP4 127.0.0.1
      s=Rear camera
      c=IN IP4 127.0.0.1
      t=0 0
      m=video 5006 RTP/AVP 96
      a=rtpmap:96 VP8/90000
